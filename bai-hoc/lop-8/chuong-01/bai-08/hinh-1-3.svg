<svg viewBox="0 0 720 290" role="img" xmlns="http://www.w3.org/2000/svg">
  <!-- ── Miếng bìa: hình chữ nhật y × z, cắt 4 hình vuông cạnh x ở góc ── -->
  <g stroke="#23304a" stroke-width="2" stroke-linejoin="round">
    <rect x="40" y="30" width="290" height="210" fill="#f8dcea"/>
    <!-- bốn góc bị cắt bỏ -->
    <rect x="40"  y="30"  width="44" height="44" fill="#fff"/>
    <rect x="286" y="30"  width="44" height="44" fill="#fff"/>
    <rect x="40"  y="196" width="44" height="44" fill="#fff"/>
    <rect x="286" y="196" width="44" height="44" fill="#fff"/>
    <!-- đường gấp (nét đứt) = viền của đáy hộp -->
    <rect x="84" y="74" width="202" height="122" fill="none" stroke-dasharray="8 6"/>
  </g>
  <g fill="#23304a" font-family="Be Vietnam Pro, Helvetica Neue, Arial, sans-serif" font-size="21" font-style="italic">
    <text x="96"  y="61">x</text>
    <text x="274" y="61" text-anchor="end">x</text>
    <text x="96"  y="227">x</text>
    <text x="274" y="227" text-anchor="end">x</text>
    <text x="26"  y="142" text-anchor="middle">z</text>
    <text x="185" y="268" text-anchor="middle">y</text>
  </g>

  <!-- ── Chiếc hộp gấp được: các cạnh khuất vẽ nét đứt ── -->
  <g stroke="#c2185b" stroke-width="2.2" stroke-linejoin="round">
    <polygon points="415,150 503,62 688,62 600,150" fill="#fbe7f1"/>
    <polygon points="415,150 600,150 600,215 415,215" fill="#f6c6dd"/>
    <polygon points="600,150 688,62 688,127 600,215" fill="#efadcf"/>
    <g stroke-dasharray="8 6" fill="none">
      <path d="M503,62 L503,127 L688,127"/>
      <path d="M503,127 L415,215"/>
    </g>
  </g>
  <g fill="#8c1246" font-family="Be Vietnam Pro, Helvetica Neue, Arial, sans-serif" font-size="17" font-style="italic">
    <text x="405" y="189" text-anchor="end">x</text>
    <text x="507" y="238" text-anchor="middle">y − 2x</text>
    <text x="654" y="186">z − 2x</text>
  </g>
</svg>
